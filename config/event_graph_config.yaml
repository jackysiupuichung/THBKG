# Event Graph Configuration
# Defines parameters for building the temporal event graph from raw Open Targets evidence.

# ============================================================================
# NOTE: Datasource weights and datatype mappings are now in:
#       config/datatype_mapping.yaml
# This file only contains time range configuration.
# ============================================================================

time_range:
  # Represents the years for which we will generate cumulative scores
  # All evidence prior to these years is also considered: rows dated before
  # first_year are counted in first_year. 1985 is before the recency window
  # (6 years) of the first decision year (1995), so folding never affects a
  # decision's recency; most pre-1985 rows are IMPC, dated by the oldest
  # paper in their literature list.
  first_year: 1985
  # Evidence runs to the 26.09 release (September 2026), so 2026 is a partial
  # year: not a decision year (src/benchmark/tasks.py LAST_DECISION_YEAR).
  last_year: 2026

