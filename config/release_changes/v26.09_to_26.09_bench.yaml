# Changes from the published v26.09 release to the 26.09 benchmark build
# (branch benchmark-3task), declared for scripts/benchmark/compare_releases.py.
#
# Every metric outside its default band (config/release_contract.yaml
# drift_defaults) is listed with the change that causes it. Each band sits just
# above the measured value (in comments, 2026-10-28 build), so a further,
# unexplained change still fails. For the next release, start a new file
# (e.g. v26.09_bench_to_26.12.yaml) and point RELEASE_CHANGES at it.

old: v26.09 (Zenodo 10.5281/zenodo.23420868; /gpfs/scratch/bty414/opentarget_evidences/26.09/hf_release/THBKG)
new: 26.09 benchmark build (/gpfs/scratch/bty414/opentarget_evidences/26.09_bench/hf_release/THBKG)

changes:
  # --- molecules: every drug type is a node ---------------------------------
  - key: nodes.molecule
    metric: added                     # 0.438 (1,136 new on 2,596)
    allow: [0.40, 0.48]
    reason: "all drug types become molecule nodes, not only small molecules with SMILES (d06b8b5)"

  # --- modulated_by: each trial counted once, more drugs ---------------------
  - key: edges.molecule|modulated_by|target
    metric: rows                      # 0.876
    allow: [0.83, 0.92]
    reason: "each (drug, target, trial) counted once; the release counted trials twice (C1, cb094a6)"
  - key: edges.molecule|modulated_by|target
    metric: pairs                     # 1.321
    allow: [1.25, 1.40]
    reason: "pairs of the drug types added as molecule nodes (d06b8b5)"
  - key: edges.molecule|modulated_by|target
    metric: lower                     # 0.256 / 0.649 / 0.731 / 0.775 at 2000 / 2010 / 2016 / 2020
    allow: [0, 0.85]
    reason: "scores fall where the release counted a trial twice (C1, cb094a6)"
  - key: edges.molecule|modulated_by|target
    metric: first_year_changed        # 0.096
    allow: [0, 0.11]
    reason: "trials with no start date left out (B5, 4bdb918) and double-counted trials removed (C1, cb094a6)"
  - key: edges.molecule|modulated_by|target
    metric: score_p50                 # 0.949
    allow: [0.90, 1.00]
    reason: "each trial counted once (C1, cb094a6)"

  # --- trial outcomes: UNKNOWN-status and undated trials --------------------
  - key: edges.target|clinical_trial_Unknown/Operational|disease
    metric: rows                      # 0.653
    allow: [0.60, 0.70]
    reason: "no outcome edge for trials of UNKNOWN status (A1, ab746d4); trials with no start date left out (B5, 4bdb918)"
  - key: edges.target|clinical_trial_Unknown/Operational|disease
    metric: pairs                     # 0.670
    allow: [0.62, 0.72]
    reason: "as rows (A1, ab746d4; B5, 4bdb918)"
  - key: edges.target|clinical_trial_Unknown/Operational|disease
    metric: missing                   # 0.103 / 0.256 / 0.258 / 0.283
    allow: [0, 0.32]
    reason: "as rows; 514 of 2,185 missing pairs before 2010 have a trial with no start date, the rest are UNKNOWN-status outcomes"
  - key: edges.target|clinical_trial_Unknown/Operational|disease
    metric: lower                     # 0.041 / 0.066 / 0.075 at 2010 / 2016 / 2020
    allow: [0, 0.09]
    reason: "as rows: a pair's highest phase came from an UNKNOWN-status or undated trial"
  - key: edges.target|clinical_trial_Unknown/Operational|disease
    metric: gone                      # 0.342
    allow: [0, 0.38]
    reason: "as rows (A1, ab746d4; B5, 4bdb918)"
  - key: edges.target|clinical_trial_Unknown/Operational|disease
    metric: first_year_changed        # 0.127
    allow: [0, 0.15]
    reason: "as rows: the first outcome came from an UNKNOWN-status or undated trial"
  - key: edges.target|clinical_trial_positive|disease
    metric: missing@2000              # 0.274 (269 of 980 pairs)
    allow: [0, 0.30]
    reason: "trials with no start date left out (B5, 4bdb918): all 269 missing pairs have one"
  - key: edges.target|clinical_trial_positive|disease
    metric: missing@2010              # 0.021 (455 of 22,167 pairs)
