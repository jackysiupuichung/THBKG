experiment:
  name: advancement_lambdarank

data:
  graph_file: /gpfs/scratch/bty414/opentarget_evidences/26.03/graph/hetero_graph_with_features_datatype_w3.pt
  mappings_file: /gpfs/scratch/bty414/opentarget_evidences/26.03/progression/temporal_graph_datatype_w3_mappings.pt
  # Advancement labels are supervision, not graph evidence: the graph registers
  # the labelled target/disease nodes only, and the outcome + transition year are
  # read from these CSVs at train/eval time. Must be the same pair the graph was
  # built against. Omitting them falls back to these in-repo defaults.
  advancement_train_csv: data/clinical_trial_advancement/26.03_w3/train_dataset.csv
  advancement_test_csv: data/clinical_trial_advancement/26.03_w3/test_dataset.csv

model:
  name: hgt
  hidden_dim: 128
  num_heads: 2
  num_layers: 2
  dropout: 0.2
  use_rte: false
  use_edge_features: true
  edge_feat_cols: [0, 1]
  edge_feat_dim: 2

train:
  output_dir: runs/advancement_lambdarank
  num_epochs: 50
  lr: 0.0004346878320299101
  weight_decay: 0.0018260646941480677
  eta_min: 1e-6
  cosine_t_max: 10
  batch_size: 1024
  num_neighbors: [20, 5]
  lambdarank:
    sigma: 1.4319388789983414
    ndcg_k: 100
  early_stopping:
    enabled: true
    patience: 5
    metric: ndcg_ta_mean@30

eval:
  prospective:
    diseases: []
    cutoff_year: 2015
    ks: [100, 200, 500]
